[package]
name = "talkapp"
version = "1.0.0"
description = "Ultra-lightweight TalkApp Desktop Client with Built-in Global Hotkeys"
authors = ["TalkApp Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
